name: CI/CD QNAP (Compose + Port Hunter)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Pomiń budowanie (tylko redeploy)'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Nazwa projektu dla Docker Compose (musi być unikalna per repozytorium)
  COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
  # Port wewnętrzny aplikacji (na jakim nasłuchuje np. Node/Python wewnątrz kontenera)
  INTERNAL_PORT: 3000

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.skip_build == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    if: always()
    needs: build
    runs-on: [self-hosted, qnap]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # To jest kluczowe dla Compose - musimy mieć plik docker-compose.yml na dysku QNAPa

      - name: Deploy with Compose
        run: |
          echo "🏁 Rozpoczynam deployment Docker Compose..."

          # 1. Logowanie do rejestru na QNAP
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # 2. Definicja pełnej nazwy obrazu
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          # Pobieramy najnowszy obraz (nawet jak nie było buildu, warto sprawdzić)
          docker pull $FULL_IMAGE

          # ====================================================
          # PORT HUNTER LOGIC (Wersja dla Compose)
          # ====================================================
          START_PORT=9000
          END_PORT=9100
          SELECTED_PORT=0

          # Próbujemy znaleźć port, jeśli ten projekt już działa
          # Szukamy kontenera, który ma w nazwie nasz COMPOSE_PROJECT_NAME
          # Zakładamy, że główny serwis nazywa się "app" (standard, o którym zaraz wspomnę)
          CURRENT_CONTAINER_NAME="${{ env.COMPOSE_PROJECT_NAME }}-app-1"
          
          EXISTING_PORT=$(docker inspect --format='{{(index (index .NetworkSettings.Ports "${{ env.INTERNAL_PORT }}/tcp") 0).HostPort}}' $CURRENT_CONTAINER_NAME 2>/dev/null || true)

          if [ ! -z "$EXISTING_PORT" ]; then
            echo "♻️ Znaleziono działającą instancję na porcie: $EXISTING_PORT"
            SELECTED_PORT=$EXISTING_PORT
          else
            echo "🆕 Aplikacja nie działa lub to pierwszy deploy. Szukam wolnego portu ($START_PORT-$END_PORT)..."
            USED_PORTS=$(docker ps --format='{{.Ports}}')
            
            for ((port=$START_PORT; port<=$END_PORT; port++)); do
              # Sprawdzamy czy port jest wolny (nie występuje w liście używanych)
              if [[ $USED_PORTS != *":$port->"* ]]; then
                echo "✅ Port $port jest wolny."
                SELECTED_PORT=$port
                break
              fi
            done
          fi

          if [ "$SELECTED_PORT" -eq 0 ]; then
             echo "❌ BŁĄD: Brak wolnych portów w zakresie $START_PORT-$END_PORT!"
             exit 1
          fi

          # ====================================================
          # URUCHOMIENIE (COMPOSE UP)
          # ====================================================
          
          echo "🚀 Podnoszenie stacka (Port: $SELECTED_PORT)..."

          # Eksportujemy zmienne, które zostaną wczytane przez docker-compose.yml
          export IMAGE_NAME=$FULL_IMAGE
          export HOST_PORT=$SELECTED_PORT
          
          # Tutaj możesz dodać sekrety, jeśli AI je doda do repo:
          # export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

          # Uruchamiamy z konkretną nazwą projektu (-p), żeby kontenery miały przewidywalne nazwy
          docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} up -d --remove-orphans

          # ====================================================
          # HEALTHCHECK & CLEANUP
          # ====================================================
          sleep 10
          
          # Sprawdzamy czy kontener wstał
          if [ "$(docker ps -q -f name=$CURRENT_CONTAINER_NAME)" ]; then
            echo "🎉 Sukces! Aplikacja dostępna."
            echo "::notice title=Deployment Complete::App running at http://TWOJE_IP:$SELECTED_PORT"
            
            # Czyszczenie starych obrazów, żeby nie zapchać QNAPa
            docker image prune -f
          else
            echo "🔥 BŁĄD: Kontener nie wstał po 10 sekundach. Sprawdź logi: docker logs $CURRENT_CONTAINER_NAME"
            exit 1
          fi