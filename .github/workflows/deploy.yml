name: Deploy to Portainer (Zero Touch - Private Repo)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    # Skoro wystawiasz Portainera na świat, możesz użyć ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Manage Portainer Stack
        env:
          # Adres Portainera (musi być dostępny z internetu!)
          PORTAINER_URL: ${{ secrets.PORTAINER_HOST }}
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }} # Zazwyczaj '2' lub '1'
          
          # Dane do logowania, żeby Portainer mógł pobrać Twoje repo
          GIT_USER: ${{ secrets.GIT_USERNAME }}
          GIT_PASS: ${{ secrets.GIT_TOKEN }}
          
          # Automatyczne zmienne z GitHuba
          STACK_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.event.repository.clone_url }}
          BRANCH: "main"
          COMPOSE_FILE: "docker-compose.yml"
        run: |
          echo "🚀 Łączę się z Portainerem pod adresem: $PORTAINER_URL"
          
          # 1. Sprawdź czy stack już istnieje
          STACK_ID=$(curl -s -k -H "X-API-Key: $API_KEY" \
            "$PORTAINER_URL/api/stacks" | \
            jq -r ".[] | select(.Name == \"$STACK_NAME\") | .Id")

          if [ -z "$STACK_ID" ]; then
            echo "🆕 Stack '$STACK_NAME' nie istnieje. Tworzę nowy..."
            
            # Tworzenie stacka z autoryzacją do prywatnego repo
            curl -s -k -X POST \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              "$PORTAINER_URL/api/stacks?method=repository&type=2&endpointId=$ENDPOINT_ID" \
              -d "{
                \"name\": \"$STACK_NAME\",
                \"gitConfig\": {
                  \"URL\": \"$REPO_URL\",
                  \"ReferenceName\": \"refs/heads/$BRANCH\",
                  \"ComposeFilePathInRepository\": \"$COMPOSE_FILE\",
                  \"Authentication\": true,
                  \"Username\": \"$GIT_USER\",
                  \"Password\": \"$GIT_PASS\"
                }
              }"
              
          else
            echo "🔄 Stack '$STACK_NAME' istnieje (ID: $STACK_ID). Wymuszam aktualizację..."
            
            # Wymuszenie git pull i redeploy (zachowując dane logowania)
            curl -s -k -X PUT \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              "$PORTAINER_URL/api/stacks/$STACK_ID/git/redeploy?endpointId=$ENDPOINT_ID" \
              -d "{
                \"repositoryReferenceName\": \"refs/heads/$BRANCH\",
                \"pullImage\": true,
                \"prune\": true
              }"
          fi
